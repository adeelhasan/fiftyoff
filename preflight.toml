# Pre-flight configuration. Changing a value here changes what gets spent — see docs/DECISIONS.md.

[budget]
# D2: hard cap on total tokens the whole pre-flight may spend (summed from research/token-ledger.jsonl).
# Base plan = 20 tokens/min -> bucket max 1,200, ~28,800/day. 600 fits in one bucket.
token_cap = 5000                 # D16: raised from 600 for Track 1 (user-approved)

[census]
date_range = 0            # 0 = last 24h, 1 = week, 2 = month, 3 = 90 days
max_pages = 40            # refuse any census command planning more pages than this (5 tokens each)

# Count queries cost 5 tokens each and return totals per root category (Keepa's nominal discount,
# = vs the 48h marketplace-New average). Sample queries return rows we re-price strictly.
# Prices are Warehouse (Resale) prices in cents. Names must not contain "-p<digit>".
[[census.queries]]
name = "n25"
mode = "counts"
min_delta = 25
[[census.queries]]
name = "n40"
mode = "counts"
min_delta = 40
[[census.queries]]
name = "n50"
mode = "counts"
min_delta = 50
[[census.queries]]
name = "n60"
mode = "counts"
min_delta = 60
[[census.queries]]
name = "n70"
mode = "counts"
min_delta = 70
[[census.queries]]
name = "n50-min20"
mode = "counts"
min_delta = 50
min_price = 2000
[[census.queries]]
name = "n50-min50"
mode = "counts"
min_delta = 50
min_price = 5000
[[census.queries]]
name = "n50-min125"
mode = "counts"
min_delta = 50
min_price = 12500
[[census.queries]]
name = "n50-min250"
mode = "counts"
min_delta = 50
min_price = 25000
[[census.queries]]
name = "n50-min20-lnvg"      # Like New + Very Good only (codes 2/3 agree across the docs)
mode = "counts"
min_delta = 50
min_price = 2000
warehouse_conditions = [2, 3]
[[census.queries]]
name = "n50-min20-single"    # one variation per parent: PF25/26 at market scale
mode = "counts"
min_delta = 50
min_price = 2000
single_variation = true
[[census.queries]]
name = "n50-min20-week"      # week vs day window: turnover hint (RQ2)
mode = "counts"
min_delta = 50
min_price = 2000
date_range = 1

# "Best deals now": the nominal-50%+ pool with media excluded and a $20 Resale-price floor,
# pulled newest-first (Keepa's percent sort surfaces bogus reference prices first).
[[census.queries]]
name = "pool50"
mode = "sample"
pages = 12
min_delta = 50
min_price = 2000
exclude_media = true
sort = 1

[history]
target_sample = 15
max_per_category = 3         # keep the best-deal sample spread across categories
min_reference_cents = 10000  # D13: best deals on items with a $100+ strict reference
offers = 20                  # offers per product request; worst case 2 pages x 6 tokens
days = 180                   # analysis window
fetch_days = 200             # fetched history (free): margin so window-edge episodes keep context

[analysis]
thresholds = [0.30, 0.40, 0.50, 0.60]

[track1]
# D16: Resale presence on popular products (the extension question). Not filtered by discount.
min_normal_cents = 10000   # 90-day New average >= $100
max_rank = 50000           # sales rank in root category
per_category = 100         # rank-stratified sample per category
offers = 20
batch_size = 10            # ASINs per /product request
days = 180
fetch_days = 200

[collector]
# D17: Track 2 forward collector. Separate ledger (research/collector/token-ledger.jsonl).
sweep_minutes = 30
max_pages = 20              # deal-feed pages per sweep (5 tokens each); target slice is ~16 pages
min_delta = 50              # Keepa nominal discount floor for the sweep
min_resale_cents = 5000     # Resale price >= $50 (normal price ~$100+ at 50% off)
watch_size = 30
watch_min_ref_cents = 10000
watch_max_rank = 50000
check_estimate = 13         # worst case per forced offer check (offers=20 + update=0)
daily_token_cap = 28000     # raised 2026-09-27 from 25,000: unused tokens expire anyway; avoids a ~3h evening gap
run_token_cap = 60000       # hard stop for this collector run (~2 days)

[tracker]
# D20: new-deal tracker. Separate ledger (research/tracker/token-ledger.jsonl); the run's token cap and
# expiry come from .fiftyoff/tracker-approval.json (tracker.py unlock), not from here.
sweep_minutes = 30
full_sweep_hours = 12
max_pages = 20                  # incremental sweeps (usually stop after 1-2 pages)
deep_minutes = 1                # D39: the 12 h deep sweep goes one page per minute, slice by slice (DEEP_SLICES)
sweep_min_delta = 30            # Keepa nominal floor for the feed query; strict tiers below decide
sweep_min_resale_cents = 2000
tiers = [[0.40, 10000], [0.30, 20000]]   # strict >= 40% with $100+ reference, or >= 30% with $200+
max_rank = 0                    # D41: no rank limit for live checks (was 50000; the census keeps 50k)
check_estimate = 7              # observed per check in D17 (13 = two offer pages, worst case)
fast_minutes = 15               # new watch or unit (<6 h)
fast_window_minutes = 120       # D40: 15-min checks for a new 50%+ deal's first 2 h only, then hourly to 6 h
watch_min_strict = 0.47         # D40: live-check from ~47% sweep-strict; near misses are seen from the sweep only (on 2026-10-06, user)
deep_watch_min_drops30 = 0      # D40 step 5: live-check 50%+ deals beyond the rank limit with this many 30-day rank drops (12 = top quarter; staged)
unconfirmed_minutes = 30        # a unit missing from the last check
slow_minutes = 1440            # D43: settled listings once a day (was 720, D32); a price change re-floats them in the sweep for free
census_enabled = true          # D32: sweep-only census of other root categories (fiftyoff/tracker.py CENSUS_CATS)
census_minutes = 2             # D32: one census page (5 tokens) every 2 min, <= 2.5 tokens/min
no_check_aisles = ["diy"]      # D58: rated DIY (faucets, hardware, plumbing, tools...) is seen-only: no paid checks

[admin]
# D36: tags an admin can put on a deal (featured strip, newsletter set...). /admin/.
tags = ["featured", "newsletter"]

[notify]
# Keyword alerts, rules k0.1 (fiftyoff/notify.py, docs/handoffs/alerts-beta.md). Starting values to tune, not decisions.
min_strict = 0.50               # the site's headline: 50%+ ...
min_ref_cents = 4000            # ... from a $40 reference
fresh_hours = 6                 # a new unit must be this fresh by Keepa's dating
min_appeal = 3                  # skip what the rater scored below this (unrated products don't wait)
repeat_hours = 72               # one message per product per subscriber in this window
site = "https://beta.fiftyoff.app"   # links in emails (deal links go through /d/{slug}?s=email)
poll_seconds = 60

# Tiers are config only: a name with perks. Billing doesn't exist; switch a subscriber with `notify.py tier`.
[tiers.free]
delay_minutes = 30              # the send window: a match waits this long, later matches join it
max_interests = 1               # keyword alerts at once (a second one shows the swap sheet)
one_shot = true                 # the alert ends once it has sent an email
lifetime_days = 30              # ...or after this many days without one (the expiry email)

[tiers.plus]                    # not sold yet (Head start): no delay, keeps firing
delay_minutes = 0
max_interests = 10
one_shot = false
lifetime_days = 0

[rater]
# The API rater (fiftyoff/rater.py, `rater.py run`, compose profile "rater"): rates new products with the Anthropic API
# on the key in .env (ANTHROPIC_API_KEY; the Max plan's monthly API credits). Never called by the tracker (rule 7).
model_id = "claude-sonnet-5-5"  # the exact model; ratings are stored as model "sonnet", like the other backends
effort = "low"                  # output_config.effort; the supervised run checks agreement before raising it
batch = 60                      # products per call
max_tokens = 16000
interval_minutes = 15           # run batches until none is full, at most max_batches, then wait
max_batches = 8
monthly_usd_cap = 25.0          # stop calling once this month's recorded spend reaches this (UTC calendar month)
# USD per million tokens (Sonnet 5.5; cache writes at 1.25x input for the 5-minute cache)
price_input = 2.00
price_output = 10.00
price_cache_read = 0.20
price_cache_write = 4.00         # 1-hour cache writes (2x input); the rubric is cached for an hour, batches are 15 min apart
