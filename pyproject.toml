[project]
name = "fiftyoff-preflight"
version = "0.1.0"
description = "Keepa feasibility pre-flight for fiftyoff (gated; see CLAUDE.md)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "requests>=2.34.2",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
