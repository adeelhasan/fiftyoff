<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>fiftyoff preview</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>½</text></svg>">
<style>
/* Layout: one column of deal rows, price and discount in a fixed right column so numbers line up.
   Palette and wordmark follow site/public/index.html (the fiftyoff.app landing page). */
:root {
  --bg: #fafaf7; --surface: #ffffff; --fg: #16161a; --muted: #6b6b76; --line: #e7e6e0;
  --accent: #e4572e; --accent-soft: #fdebe5; --warn: #9a6a00; --warn-soft: #fbf1d9;
  --font: system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111114; --surface: #18181c; --fg: #f2f2ee; --muted: #9a9aa6; --line: #2a2a31;
  --accent: #f0714b; --accent-soft: #3a211a; --warn: #e3b450; --warn-soft: #33290f; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111114; --surface: #18181c; --fg: #f2f2ee; --muted: #9a9aa6; --line: #2a2a31;
  --accent: #f0714b; --accent-soft: #3a211a; --warn: #e3b450; --warn-soft: #33290f; color-scheme: dark }
* { box-sizing: border-box }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 var(--font); padding-inline: 16px; padding-block: 28px 40px }
main { max-width: 860px; margin: 0 auto; display: grid; gap: 20px }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 12px }
.mark { font-size: 30px; font-weight: 800; letter-spacing: -.03em; line-height: 1; margin: 0 }
.mark span { color: var(--accent) }
.chip { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px }
.lede { color: var(--muted); margin: 6px 0 0; max-width: 60ch }
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center }
.controls label { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center }
select { font: inherit; font-size: 14px; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px }
select:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.count { margin-left: auto; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums }
ol { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden }
li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 16px; padding: 14px 16px; border-top: 1px solid var(--line) }
li:first-child { border-top: 0 }
.title { font-weight: 600; margin: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden }
.title a { color: inherit; text-decoration: none }
.title a:hover { text-decoration: underline }
.meta { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 12px }
.seen.stale { color: var(--warn); background: var(--warn-soft); border-radius: 4px; padding: 0 6px }
.nums { grid-row: span 2; text-align: right; display: grid; align-content: start; justify-items: end; gap: 4px; font-variant-numeric: tabular-nums }
.off { background: var(--accent-soft); color: var(--accent); font-weight: 800; font-size: 15px; border-radius: 6px; padding: 2px 8px }
.price { font-weight: 700; font-size: 17px }
.empty, .error { padding: 28px 16px; text-align: center; color: var(--muted) }
footer { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 16px; justify-content: space-between }
footer a { color: inherit }
@media (max-width: 480px) { .count { margin-left: 0; width: 100% } }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1 class="mark">fifty<span>off</span></h1>
      <p class="lede">Amazon Resale units at a genuine discount, checked live. Closed preview: data straight from the tracker.</p>
    </div>
    <span class="chip">Closed preview</span>
  </header>

  <div class="controls">
    <label for="cat">Category
      <select id="cat">
        <option value="">All</option>
        <option>Electronics</option><option>Home &amp; Kitchen</option><option>Appliances</option>
        <option>Tools &amp; Home Improvement</option><option>Sports &amp; Outdoors</option>
      </select>
    </label>
    <label for="sort">Sort
      <select id="sort">
        <option value="newest">Recently confirmed</option>
        <option value="discount">Biggest discount</option>
        <option value="price">Lowest price</option>
      </select>
    </label>
    <span class="count" id="count" aria-live="polite">Loading deals…</span>
  </div>

  <ol id="deals"></ol>

  <footer>
    <span>Prices and availability change quickly. "Confirmed" is our last live check of the offer.</span>
    <a href="https://keepa.com" rel="noopener" target="_blank">Data by Keepa</a>
  </footer>
</main>
<script>
const $ = (id) => document.getElementById(id);
const usd = (n) => n.toLocaleString("en-US", { style: "currency", currency: "USD" });
const ago = (m) => m < 1 ? "just now" : m < 60 ? `${m} min ago` : m < 1440 ? `${Math.floor(m / 60)} h ago` : `${Math.floor(m / 1440)} d ago`;
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function row(d) {
  const stale = d.unconfirmed;
  const seen = stale ? `Not seen since ${ago(d.minutes_since_confirmed)}` : `Confirmed ${ago(d.minutes_since_confirmed)}`;
  return `<li>
    <p class="title"><a href="${esc(d.url)}" rel="noopener" target="_blank">${esc(d.title)}</a></p>
    <div class="nums"><span class="off">${d.pct_off}% off</span><span class="price">${usd(d.price)}</span></div>
    <div class="meta"><span>${esc(d.category)}</span><span>${esc(d.condition)}</span>
      <span class="seen${stale ? " stale" : ""}">${seen}</span></div>
  </li>`;
}

async function load() {
  const q = new URLSearchParams({ sort: $("sort").value, limit: "200" });
  if ($("cat").value) q.set("category", $("cat").value);
  try {
    const r = await fetch(`/api/feed?${q}`);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const data = await r.json();
    $("deals").innerHTML = data.deals.length ? data.deals.map(row).join("")
      : `<li class="empty">No qualifying deals confirmed yet. The tracker checks new deals first; give it a few minutes.</li>`;
    $("count").textContent = `${data.count} deal${data.count === 1 ? "" : "s"} · updated ${new Date(data.generated_at).toLocaleTimeString()}`;
  } catch (e) {
    $("deals").innerHTML = `<li class="error">Couldn't load deals (${esc(e.message)}). The API may be restarting; this page retries every minute.</li>`;
  }
}
$("cat").addEventListener("change", load);
$("sort").addEventListener("change", load);
load();
setInterval(load, 60_000);
</script>
</body>
</html>
