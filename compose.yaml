# Local stack, identical on the VPS.
#   docker compose up -d                                   # Postgres only
#   docker compose run --rm app                            # tests (network-blocked)
#   docker compose run --rm app collector.py report        # free, from saved data
#   docker compose run --rm app collector.py run --dry-run # plan only
#   docker compose run --rm app tracker.py unlock          # approve a tracker run ([y/N], token cap, expiry)
#   docker compose --profile tracker up -d tracker         # start the long-running tracker
#   docker compose up -d api                               # read-only feed API + preview on 127.0.0.1:8000
#   docker compose up -d tunnel                            # https://preview.fiftyoff.app (named Cloudflare tunnel)
#   docker compose --profile preview up -d preview-tunnel  # old temporary *.trycloudflare.com URL (retired)
# `app` and `tracker` sit in profiles, so a plain `up` never starts them. The tracker spends nothing
# without a valid .fiftyoff/tracker-approval.json; it waits instead (CLAUDE.md rules 1-2).

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: fiftyoff
      POSTGRES_DB: fiftyoff
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fiftyoff-dev}  # local default; the VPS sets its own in .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"   # localhost only, never public
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fiftyoff -d fiftyoff"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    image: fiftyoff:latest
    profiles: ["tools"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://fiftyoff:${POSTGRES_PASSWORD:-fiftyoff-dev}@db:5432/fiftyoff
    volumes:
      # Data and gate state live on the host, never inside the image.
      - ./research:/app/research
      - ./.fiftyoff:/app/.fiftyoff
      - ./preflight.toml:/app/preflight.toml:ro
    depends_on:
      db:
        condition: service_healthy

  tracker:
    image: fiftyoff:latest   # same image as app (build it with `docker compose build app`)
    profiles: ["tracker"]
    command: ["tracker.py", "run"]
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://fiftyoff:${POSTGRES_PASSWORD:-fiftyoff-dev}@db:5432/fiftyoff
    volumes:
      - ./research:/app/research
      - ./.fiftyoff:/app/.fiftyoff:ro
      - ./preflight.toml:/app/preflight.toml:ro
    depends_on:
      db:
        condition: service_healthy

  api:
    image: fiftyoff:latest
    command: ["uvicorn", "fiftyoff.api:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
    restart: unless-stopped
    environment:
      # narrow role: feed + admin views, curation writes only (created by scripts/feed-reader.sh)
      FEED_DATABASE_URL: postgresql://feed_reader:${FEED_READER_PASSWORD:-feed-dev}@db:5432/fiftyoff
      PREVIEW_PASSWORD: ${PREVIEW_PASSWORD:-}   # set -> browser login popup (user "fiftyoff"); empty -> open
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}       # set -> /admin opens to user "admin" (D36); empty -> closed
    volumes:
      - ./preflight.toml:/app/preflight.toml:ro   # [admin] tags
    ports:
      - "127.0.0.1:8000:8000"   # localhost only; reach it over an SSH tunnel or a Cloudflare Tunnel
    depends_on:
      db:
        condition: service_healthy

  # Stable public HTTPS: Cloudflare named tunnel "fiftyoff" -> api (preview.fiftyoff.app, D25).
  # Credentials live in ./.cloudflared on the server only (gitignored); CF_TUNNEL_ID comes from .env.
  # The api keeps its login popup; DNS routes are added with `cloudflared tunnel route dns`.
  tunnel:
    image: cloudflare/cloudflared:2026.9.3
    command: ["tunnel", "--no-autoupdate", "--credentials-file", "/home/nonroot/.cloudflared/${CF_TUNNEL_ID}.json",
              "run", "--url", "http://api:8000", "${CF_TUNNEL_ID}"]
    volumes:
      - ./.cloudflared:/home/nonroot/.cloudflared:ro
    restart: unless-stopped
    depends_on: [api]

  # Temporary public HTTPS address (*.trycloudflare.com) for the preview, no Cloudflare account needed.
  # The address changes on every restart: find it with `docker compose --profile preview logs preview-tunnel`.
  preview-tunnel:
    image: cloudflare/cloudflared:2026.9.1
    profiles: ["preview"]
    command: ["tunnel", "--no-autoupdate", "--url", "http://api:8000"]
    restart: unless-stopped
    depends_on: [api]

volumes:
  pgdata:
